{% extends 'base.html' %}

{% block title %}GestorOS - Ordens de Serviço{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center mt-4 mb-5">Gerenciamento de Ordens de Serviço</h2>

    <div class="tile-grid">
        <!-- ABRIR NOVA OS -->
        <a href="{{ url_for('abrir_os') }}" class="tile">
            <i class="fas fa-plus-circle fa-3x"></i>
            <span>Abrir Nova OS</span>
        </a>

        <!-- EDITAR OS -->
        <a href="{{ url_for('editar_os', os_id=1) }}" class="tile">
            <i class="fas fa-edit fa-3x"></i>
            <span>Editar OS</span>
        </a>

        <!-- FINALIZAR OS -->
        <a href="{{ url_for('finalizar_os', os_id=1) }}" class="tile">
            <i class="fas fa-check-circle fa-3x"></i>
            <span>Finalizar OS</span>
        </a>

        <!-- VISUALIZAR MÍDIAS -->
        <a href="{{ url_for('midias_os', os_id=1) }}" class="tile">
            <i class="fas fa-photo-video fa-3x"></i>
            <span>Visualizar Mídias</span>
        </a>

        <!-- RELATÓRIOS -->
        <a href="{{ url_for('relatorios') }}" class="tile">
            <i class="fas fa-file-alt fa-3x"></i>
            <span>Relatórios</span>
        </a>

        <!-- VOLTAR -->
        <a href="{{ url_for('index') }}" class="tile">
            <i class="fas fa-arrow-circle-left fa-3x"></i>
            <span>Voltar</span>
        </a>
    </div>
</div>
{% endblock %}
