<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Abrir Nova OS</title>
</head>
<body>
    <a href="/">Voltar para Início</a>
    
    <h1>Abrir Nova Ordem de Serviço</h1>
    <hr>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: red;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('abrir_os') }}" method="POST">
        
        <label for="parceiro">Parceiro (Cliente):</label>
        <select id="parceiro" name="parceiro_id" required>
            <option value="">-- Selecione um Parceiro --</option>
            
            {% for cliente in clientes %}
                <option value="{{ cliente.id }}"
                        {% if dados_form and dados_form.parceiro_id|int == cliente.id %}selected{% endif %}>
                    {{ cliente.nome }}
                    </option>
            {% endfor %}
        </select>
        <br><br>

        <label for="equipamento">Equipamento:</label>
        <input type="text" id="equipamento" name="equipamento" 
               value="{{ dados_form.equipamento or '' }}" required>

        <br><br>

        <label for="defeito">Defeito Reclamado:</label>
        <textarea id="defeito" name="defeito" required>{{ dados_form.defeito or '' }}</textarea>

        <br><br>

        <label for="acessorios">Acessórios (opcional):</label>
        <input type="text" id="acessorios" name="acessorios"
               value="{{ dados_form.acessorios or '' }}">

        <br><br>

        <label for="tecnico">Técnico Responsável:</label>
        <select id="tecnico" name="tecnico_id" required>
            <option value="">-- Selecione um Técnico --</option>
            {% for tecnico in tecnicos %}
                <option value="{{ tecnico.id }}"
                        {% if dados_form and dados_form.tecnico_id|int == tecnico.id %}selected{% endif %}>
                    {{ tecnico.nome }}
                </option>
            {% endfor %}
        </select>
        
        <br><br>

        <button type="submit">Abrir OS</button>
    </form>

</body>
</html>
